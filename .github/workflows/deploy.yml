name: Deploy Relay to Hetzner

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Push Relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Secrets
        run: |
          echo "=== Checking Secret Availability ==="
          if [ -n "${{ secrets.HETZNER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}" ]; then
            echo "✅ SSH Key Secret is present."
          else
            echo "❌ ERROR: SSH Key Secret is MISSING!"
            echo "Please ensure HETZNER_SSH_KEY is set in Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON || secrets.FCM_JSON }}" ]; then
            echo "✅ FCM Service Account Secret is present."
          else
            echo "⚠️ Warning: FCM Service Account Secret is not detected."
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST || '95.217.5.54' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Hetzner
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST || '95.217.5.54' }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
          FCM_RAW: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON || secrets.FCM_JSON }}
        run: |
          if [ -n "$FCM_RAW" ]; then
            FCM_B64=$(echo -n "$FCM_RAW" | base64 -w 0)
          else
            FCM_B64=""
          fi

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
            "FCM_B64='$FCM_B64' bash -s" << 'EOF'
          set -e
          cd /opt/bulwark-relay
          git remote set-url origin https://github.com/nordible/email-notifications.nordible.co.git || true
          git fetch origin
          git checkout -f main 2>/dev/null || git checkout -f master
          git reset --hard origin/$(git branch --show-current)

          mkdir -p /opt/bulwark-relay/data

          if [ -n "$FCM_B64" ]; then
            echo "$FCM_B64" | base64 -d > /opt/bulwark-relay/data/fcm-service-account.json
            chmod 644 /opt/bulwark-relay/data/fcm-service-account.json
            echo "✅ fcm-service-account.json updated from secret."
          else
            echo "⚠️ Warning: FCM_B64 is empty."
          fi

          docker compose up -d --build --force-recreate
          sleep 3
          docker ps --filter name=bulwark-relay
          echo "=== Bulwark Relay logs ==="
          docker logs --tail 30 bulwark-relay || true
          echo "✅ Deployment finished successfully!"
          EOF
