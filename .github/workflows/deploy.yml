name: Deploy Relay to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Push Relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy and configure FCM on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          FCM_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: FCM_JSON
          script: |
            set -e
            cd /opt/bulwark-relay
            git fetch origin
            git checkout main
            git pull origin main

            mkdir -p /opt/bulwark-relay/data

            if [ -n "$FCM_JSON" ]; then
              echo "$FCM_JSON" > /opt/bulwark-relay/data/fcm-service-account.json
              chmod 600 /opt/bulwark-relay/data/fcm-service-account.json
              echo "✅ fcm-service-account.json updated from secret."
            fi

            docker compose up -d --build --force-recreate
            sleep 3
            docker ps --filter name=bulwark-relay
            echo "=== Bulwark Relay logs ==="
            docker logs --tail 30 bulwark-relay || true
            echo "✅ Deployment finished successfully!"
