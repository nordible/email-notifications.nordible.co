name: Deploy to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "resources/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy Container via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            echo "=== Deploying latest stalwart mail server ==="

            # Authenticate to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Ensure network and directories
            docker network create nordible-net || true
            mkdir -p /opt/nordible-mail-server/data /opt/nordible-mail-server/etc
            chown -R 2000:2000 /opt/nordible-mail-server/data /opt/nordible-mail-server/etc

            # Recreate mail server container
            docker rm -f nordible-mail-server || true
            docker run -d --name nordible-mail-server \
              --restart unless-stopped \
              --network nordible-net \
              --env-file /opt/nordible-mail-server/.env \
              -p 25:25 -p 465:465 -p 587:587 -p 993:993 -p 8080:8080 \
              -v /opt/nordible-mail-server/data:/var/lib/stalwart \
              -v /opt/nordible-mail-server/etc:/etc/stalwart \
              ghcr.io/${{ github.repository }}:latest

            echo "=== Verifying mail server ==="
            sleep 4
            docker ps --filter name=nordible-mail-server
            docker image prune -f
            echo "=== Deployment completed successfully! ==="
